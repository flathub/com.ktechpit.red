app-id: com.ktechpit.red
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: red
finish-args:
  - --device=all
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio

  - --own-name=org.mpris.MediaPlayer2.red
  - --talk-name=org.kde.StatusNotifierWatcher

  - --filesystem=/run/udev:ro
  - --filesystem=xdg-download

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - /share/doc

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - deno.yaml

  - name: red
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DRED_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/keshavbhatt/red.git
        tag: v10.3.2
        commit: 4baf5d18c1d2f0d2200185cf976dcd6c4bbc694f
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
